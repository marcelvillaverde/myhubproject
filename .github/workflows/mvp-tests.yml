name: mvp-tests

on:
  push:
    paths: ["mvp/**", ".github/workflows/mvp-tests.yml"]
  pull_request:
    paths: ["mvp/**", ".github/workflows/mvp-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
